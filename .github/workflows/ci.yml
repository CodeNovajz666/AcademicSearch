name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Java 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  agent-python:
    name: Python Agent 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        working-directory: agent-python
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: pytest
        working-directory: agent-python
        run: pytest -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: npm ci + build
        working-directory: frontend-react
        run: |
          npm ci
          npm run build
