server:
  port: 8080

spring:
  application:
    name: literature-search

  datasource:
    url: jdbc:mysql://localhost:3306/example_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

aliyun:
  dashscope:
    api-key: ***REMOVED_DASHSCOPE_KEY***
    endpoint: https://dashscope.aliyuncs.com/api/text/embedding
    chat-endpoint: https://dashscope.aliyuncs.com/api/text/chat
    model-name: text-embedding-v1
    chat-model-name: qwen-turbo

jwt:
  secret: ***REMOVED_OLD_JWT_SECRET***
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.example.literaturesearch: DEBUG