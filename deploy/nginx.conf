# AcademicSearch 统一入口：静态前端 + 双后端反代
# /api → Java(8080)；/agent-api → Python(8000，去前缀)；其余 → SPA 静态文件

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream java_backend {
        server backend:8080;
    }
    upstream agent_backend {
        server agent:8000;
    }

    server {
        listen 80;
        server_name _;

        # 上传上限与 Java multipart 50MB 对齐
        client_max_body_size 50m;

        # Java 后端（认证/文献/RAG/设置）
        location /api/ {
            proxy_pass http://java_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Python Agent（SSE 流式必须关闭缓冲；去 /agent-api 前缀，与 Vite dev 代理一致）
        location /agent-api/ {
            rewrite ^/agent-api(/.*)$ $1 break;
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # 前端 SPA：静态文件 + 路由 fallback
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
